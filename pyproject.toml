[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fatest"
version = "2.1.0"
description = "A fast, clean terminal speedtest tool"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "FaTest contributors" }
]
keywords = ["speedtest", "network", "cli", "terminal", "bandwidth"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "speedtest-cli>=2.1.3",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/naxce/fatest"
Repository = "https://github.com/naxce/fatest"
Issues = "https://github.com/naxce/fatest/issues"

[project.scripts]
fatest = "fatest.cli:main"

[tool.setuptools]
packages = ["fatest"]
