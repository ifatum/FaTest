<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- window body -->
  <rect x="0" y="0" width="256" height="256" rx="40" fill="url(#bg)"/>

  <!-- title bar -->
  <rect x="0" y="0" width="256" height="46" rx="40" fill="#0f172a"/>
  <rect x="0" y="26" width="256" height="20" fill="#0f172a"/>
  <circle cx="30" cy="23" r="7" fill="#ef4444"/>
  <circle cx="54" cy="23" r="7" fill="#f59e0b"/>
  <circle cx="78" cy="23" r="7" fill="#22c55e"/>

  <!-- separator line -->
  <rect x="0" y="46" width="256" height="2" fill="#1e293b"/>

  <!-- prompt caret -->
  <path d="M 34 108 L 68 132 L 34 156" fill="none" stroke="url(#accent)"
        stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blinking cursor block -->
  <rect x="86" y="120" width="66" height="24" rx="3" fill="#f8fafc"/>

  <!-- signal / speed bars, terminal-graph style -->
  <rect x="168" y="132" width="12" height="24" rx="2" fill="#22d3ee"/>
  <rect x="186" y="118" width="12" height="38" rx="2" fill="#22d3ee"/>
  <rect x="204" y="100" width="12" height="56" rx="2" fill="#34d399"/>

  <!-- command label -->
  <text x="128" y="210" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace"
        font-weight="700" font-size="30" fill="#f8fafc" letter-spacing="1">fatest</text>
</svg>
